name: Publish to npm

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  publish:
    name: Publish @asaje/skills to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Verify package
        run: |
          echo "Package to publish:"
          node -e "import('node:fs/promises').then(fs => fs.readFile('./package.json','utf8')).then(t => { const p = JSON.parse(t); console.log('  Name:', p.name); console.log('  Version:', p.version); })"
          echo ""
          echo "Contents:"
          npm pack --dry-run 2>&1 | tail -n +3

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
